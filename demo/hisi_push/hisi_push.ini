# hisi_push 配置文件
# url  : SRS WHIP 推流地址(必填)
url=http://47.76.137.109:1985/rtc/v1/whip/?app=live&stream=livestream

# file : 本地 Annex-B h264 文件(用于上板前验证链路), 留空则等待海思 VENC 送帧
file=

# fps  : 文件回放帧率
fps=25

# venc_chn : 海思 VENC 通道号, >=0 时从该通道取 H.264 码流, -1 关闭
#            pipeline=1 时由 hisi_push 在该通道上创建 H.264 编码:
#              0 = 主码流(2560x1440), 1 = 子码流(D1 720x480)
venc_chn=1

# pipeline : 1 = hisi_push 自己初始化 VI/VPSS/VENC(无需再运行 sample_venc_rtsp)
#            0 = 编码通道由外部程序创建, hisi_push 只取流
pipeline=1

# gop : VENC 关键帧间隔(帧数), 编码帧率 30fps
#       15 = 0.5 秒一个 IDR, 低延迟/丢包恢复更快, 码率略高
#       30 = 1 秒, 默认; 太大会明显增加起播延迟
gop=15
